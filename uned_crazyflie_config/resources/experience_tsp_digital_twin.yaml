# Ejemplo de experiencia para el launch único (uned_crazyflie_config/launch/experience.launch.py).
# 1 Crazyflie en modo gemelo digital (driver: firmware -> crazyflie_firmware.urdf,
# el firmware real de Bitcraze compilado para SITL) recorriendo 4 waypoints
# resueltos como TSP, con registro del vuelo en un ros2 bag.
#
#   ros2 launch uned_crazyflie_config experience.launch.py config_file:=experience_tsp_digital_twin.yaml

Simulation:
  enable: true
  world: RoboticPark_1cf.wbt

Robots:
  dron01:
    name: dron01
    type: digital_twin
    driver: firmware
    config_path: crazyflie_intern_default.yaml

Interface:
  rqt:
    enable: false
  rviz:
    enable: true
    file: crazyflie.rviz

Data_Logging:
  enable: true
  all: false
  topics: /dron01/local_pose
  name: date

Missions:
  - pkg: uned_crazyflie_missions
    executable: tsp_waypoints
    name: tsp_mission
    params:
      robot_id: dron01
      waypoints: [0.0, 0.0, 1.0, 2.0, 0.0, 1.0, 2.0, 2.0, 1.0, 0.0, 2.0, 1.0]
      tolerance: 0.15
      loop: false
