# Ejemplo de experiencia para el launch único (uned_crazyflie_config/launch/experience.launch.py).
# 2 Crazyflies virtuales en Webots, teleoperados, con interfaz RQT + RViz genéricas.
#
#   ros2 launch uned_crazyflie_config experience.launch.py config_file:=experience_swarm_teleop.yaml

Simulation:
  enable: true
  world: RoboticPark_2cf.wbt

Robots:
  dron01:
    name: dron01
    type: virtual
    driver: pid
    config_path: crazyflie_intern_default.yaml
  dron02:
    name: dron02
    type: virtual
    driver: pid
    config_path: crazyflie_intern_default.yaml

Interface:
  rqt:
    enable: true
    file: crazyflie.perspective
  rviz:
    enable: true
    file: crazyflie.rviz

Data_Logging:
  enable: false

Missions: []
